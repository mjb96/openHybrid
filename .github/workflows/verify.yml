name: Required verification

on:
  workflow_call:
  pull_request:
  push:
    branches: ['codex/**', 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax-check every JavaScript module
        run: |
          find js scripts sw.js -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Install required Chromium
        run: npx playwright install --with-deps chromium

      - name: Type, precache, workflow, unit, and smoke verification
        run: npm run verify

      - name: Required real-browser checks
        run: npm run browser:verify

  android:
    name: Android verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK platform 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" --sdk_root=$ANDROID_HOME

      - name: Install locked web dependencies
        run: npm ci

      - name: Stage production web assets
        run: node scripts/stage-web-root.mjs android/app/src/main/assets/www

      - name: Test, lint, and assemble debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000"
        run: |
          set -o pipefail
          # Maven Central rate-limits shared GitHub runner IPs (429). The
          # Google-hosted mirror in settings.gradle.kts is the primary fix;
          # retry only dependency-resolution failures with backoff. A real
          # test/lint failure still fails immediately.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Android build attempt $attempt/3"
            if gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --max-workers=2 2>&1 | tee /tmp/openhybrid-verify-build.log; then
              exit 0
            fi
            if ! grep -qE "429|Too Many Requests|Could not resolve|Could not GET" /tmp/openhybrid-verify-build.log; then
              echo "::error::Gradle failed for a non-dependency reason."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gradle still blocked by dependency resolution after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done
