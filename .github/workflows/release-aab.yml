name: Release (AAB + APK)

# Builds a SIGNED Android App Bundle (.aab) + APK for Play upload.
#
# Runs automatically on every merge to main (versionName is auto-derived as
# 1.0.<commit-count>), and can also be run manually with an explicit versionName
# for a real Play release.
#
# [You] add these repository secrets first (Settings → Secrets → Actions):
#   KEYSTORE_BASE64     - your upload keystore, base64-encoded
#                         (base64 -w0 my-release.keystore | pbcopy)
#   KEYSTORE_PASSWORD   - keystore password
#   KEY_ALIAS           - key alias
#   KEY_PASSWORD        - key password
# The signed AAB is uploaded as a build artifact to download and push to Play.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (e.g. 1.0.0) — blank auto-derives 1.0.<commitCount>'
        required: false
        default: ''

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so VERSION_CODE = commit count is stable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK platform 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" --sdk_root=$ANDROID_HOME

      - name: Copy PWA into Android assets
        run: |
          # Explicit production allowlist (scripts/stage-web-root.mjs) — ships
          # ONLY runtime assets, never docs/SQL/audits/tests/config into the APK.
          node scripts/stage-web-root.mjs android/app/src/main/assets/www

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — add the signing secrets before building a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openhybrid-release.keystore"

      - name: Build signed release bundle + APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          KEYSTORE_PATH: ${{ runner.temp }}/openhybrid-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INPUT_VERSION_NAME: ${{ inputs.versionName }}
          GRADLE_OPTS: "-Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000"
        run: |
          set -o pipefail
          export VERSION_CODE=$(git rev-list --count HEAD)
          # Manual dispatch can pin a versionName; an automatic merge-to-main
          # build derives 1.0.<commitCount> so it always increments.
          export VERSION_NAME="${INPUT_VERSION_NAME:-1.0.$VERSION_CODE}"
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          # bundleRelease → .aab for Play; assembleRelease → signed .apk for sideload testing.
          # Maven Central rate-limits shared runner IPs (429); the Google mirror in
          # settings.gradle.kts is primary, and only dependency failures retry.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Release build attempt $attempt/3"
            if gradle assembleRelease bundleRelease --no-daemon --max-workers=2 2>&1 | tee /tmp/openhybrid-release-build.log; then
              exit 0
            fi
            if ! grep -qE "429|Too Many Requests|Could not resolve|Could not GET" /tmp/openhybrid-release-build.log; then
              echo "::error::Release build failed for a non-dependency reason."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Release build still blocked by dependency resolution after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 30))
            attempt=$((attempt + 1))
          done

      - name: Upload AAB artifact (Play upload)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openhybrid-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact (sideload / device test)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openhybrid-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
